# ============================================================
# ShadowOpentech Expired Certificate Rule - Plugin Config
# ============================================================
# This file is the single source of truth for plugin defaults.
# Update here and rebuild the JAR — no logic changes needed.

# Number of days before expiry to raise a CertificateExpiringSoon warning.
expiredcert.warning.days=60

# Comma-separated fallback passwords tried when opening JKS/PKCS12 keystores.
# These are tried AFTER any passwords configured via sonar.expiredcert.keystorePasswords.
# An empty entry (trailing comma or double comma) represents a blank/no-password keystore.
keystore.fallback.passwords=changeit,changeme,password,keystorepass,keystore,storepass,trustpass,truststorepass,123456,secret,default,p@ssw0rd,
