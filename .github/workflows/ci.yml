name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Build & Test
  # Runs on every push and every PR targeting main
  # ─────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn clean test

  # ─────────────────────────────────────────────
  # Job 2: Pre-release
  # Only on push to main (not on PRs).
  # Builds the plugin JAR and publishes a GitHub
  # pre-release. Promote to official release
  # manually after validation.
  # ─────────────────────────────────────────────
  pre-release:
    name: Pre-release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build plugin JAR
        run: mvn package -DskipTests

      - name: Read project version from pom.xml
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-pre.${{ github.run_number }}
          name: "v${{ steps.version.outputs.version }} Pre-release #${{ github.run_number }}"
          prerelease: true
          files: target/customSQ-expiredCert-rule-*.jar
          body: |
            **Pre-release** — built from commit ${{ github.sha }}

            All tests passed. Review and validate before promoting to an official release.

            ### Promoting to official release
            1. Go to **Releases** in this repo
            2. Find this pre-release
            3. Click **Edit** → uncheck **This is a pre-release** → **Update release**
